name: snmp-agentx (python) build and test

on:
  push:
    branches: [ "python", "master" ]
    paths:
      - 'smartmon_agentx.py'
      - 'bin/**'
      - 'etc/**'
      - 'man/**'
      - 'doc/**'
      - 'systemd/**'
      - 'tests/fixtures/**'
      - 'tests/fixture-variants/**'
      - 'ci/Dockerfile.agentx_py'
      - 'ci/run_docker_py.sh'
      - 'ci/run_integration_test.py'
      - 'ci/integration_test.yaml'
      - '.github/workflows/snmp-agentx-py.yml'
  pull_request:
    branches: [ "python", "master" ]
    paths:
      - 'smartmon_agentx.py'
      - 'bin/**'
      - 'etc/**'
      - 'man/**'
      - 'doc/**'
      - 'systemd/**'
      - 'tests/fixtures/**'
      - 'tests/fixture-variants/**'
      - 'ci/Dockerfile.agentx_py'
      - 'ci/run_docker_py.sh'
      - 'ci/run_integration_test.py'
      - 'ci/integration_test.yaml'
      - '.github/workflows/snmp-agentx-py.yml'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: the agent and test harness must compile and the CLI must respond
  # (--help / --version run before netsnmpagent is imported, so no deps needed).
  # ---------------------------------------------------------------------------
  syntax-check:
    name: Compile and CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Byte-compile
        run: python3 -m py_compile smartmon_agentx.py ci/run_integration_test.py

      - name: CLI smoke test
        run: |
          python3 smartmon_agentx.py --version
          python3 smartmon_agentx.py --help

  # ---------------------------------------------------------------------------
  # Full build + live SNMP integration test inside Docker (needs net-snmp +
  # python3-netsnmpagent, provided by ci/Dockerfile.agentx_py).
  # ---------------------------------------------------------------------------
  docker-integration:
    name: Docker build + live SNMP integration test
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile.agentx_py
          push: false
          load: true
          tags: smartmon-agentx-py-test:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration test
        run: |
          mkdir -p .tmp/test-py
          docker run --rm \
            -v "$PWD/.tmp/test-py:/output" \
            --cap-add NET_BIND_SERVICE \
            -e AGENTXD_BIN=/src/smartmon_agentx.py \
            smartmon-agentx-py-test:${{ github.sha }}

      - name: Upload snmpwalk output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snmpwalk-output-py-${{ github.sha }}
          path: .tmp/test-py/
          if-no-files-found: warn

name: snmp-agentxd build and test

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'bin/**'
      - 'etc/**'
      - 'man/**'
      - 'systemd/**'
      - 'ci/Dockerfile.agentxd'
      - 'ci/run_integration_test.py'
      - 'ci/integration_test.yaml'
      - '.github/workflows/snmp-agentxd.yml'
      - 'Makefile'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'bin/**'
      - 'etc/**'
      - 'man/**'
      - 'systemd/**'
      - 'ci/Dockerfile.agentxd'
      - 'ci/run_integration_test.py'
      - 'ci/integration_test.yaml'
      - '.github/workflows/snmp-agentxd.yml'
      - 'Makefile'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Unit + integration tests (no net-snmp runtime, fast)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ make

      - name: Run tests
        run: |
          cd tests
          make test

  # ---------------------------------------------------------------------------
  # Full build + live SNMP integration test inside Docker
  # ---------------------------------------------------------------------------
  docker-integration:
    name: Docker build + live SNMP integration test
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 800
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile.agentxd
          push: false
          load: true
          tags: smartmon-agentxd-test:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration test
        run: |
          mkdir -p .tmp/test
          docker run --rm \
            -v "$PWD/.tmp/test:/output" \
            --cap-add NET_BIND_SERVICE \
            smartmon-agentxd-test:${{ github.sha }}

      - name: Upload snmpwalk output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snmpwalk-output-${{ github.sha }}
          path: .tmp/test/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # cppcheck static analysis on agentxd sources
  # ---------------------------------------------------------------------------
  cppcheck:
    name: cppcheck static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --error-exitcode=1 \
            --std=c++14 \
            --enable=warning,style,performance \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            -I src \
            src/*.cpp src/*.h \
            --suppress=unusedFunction \
            2>&1 | tee cppcheck.txt

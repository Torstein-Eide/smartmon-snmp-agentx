# ci/integration_test.yaml - config and test specs for run_integration_test.py

config:
  ent_oid: "1.3.6.1.4.1.65891.1.1"
  community: "public"
  snmp_port_base: 10161
  trap_port_base: 12162
  binary_search_paths:
    - "/build/smartmon-snmp-agentxd"
    - ".build/smartmon-snmp-agentxd"
    - "build/smartmon-snmp-agentxd"
    - "smartmon-snmp-agentxd"
  agentx_register_poll_attempts: 40
  agentx_register_poll_interval: 0.5

fixture_variants:
  patterns:
    - "*.failing.json"
    - "*.selftest-fail.json"
    - "*.selftest-fail.ata.json"
    - "*.selftest-fail.scsi.json"
    - "*.attr-fail.ata.json"
    - "*.health-fail.ata.json"
    - "*.health-fail.scsi.json"
    - "*.nofail.ata.json"
    - "*.uncorrected.scsi.json"
    - "*.sensor-high-crit.nvme.json"
    - "*.sensor-high-warn.nvme.json"
    - "*.sensor-low-warn.nvme.json"
    - "*.sensor-low-crit.nvme.json"
    - "*.discover.nvme.json"
    - "*.poll-failed.nvme.json"

# Each device entry describes how to discover the device's index from the walk
# output.  The runner greps the walk file for a line matching value_pattern and
# extracts the second-to-last OID component as the index.
#
# oid_grep_re: ERE applied to the full OID portion (after ENT) of matching lines.
#   The device index is the second-to-last dot-separated component.
# value_pattern: literal string matched against the " = VALUE" part of the line.

discovery:
  nvme:
    label: "Samsung 980 PRO"
    walk_label: "nvme"
    oid_grep_re: '\.3\.1\.15\.1\.15\.[0-9]+\.1'
    value_pattern: "Counter64: 1827"

  sata:
    label: "WDC SELFTESTS"
    walk_label: "sata"
    oid_grep_re: '\.4\.1\.9\.1\.9\.[0-9]+\.9'
    value_pattern: "Counter64: 4321"

  sata2:
    label: "WDC WD140EFGX 81GDJW2V"
    walk_label: "sata"
    oid_grep_re: '\.4\.1\.9\.1\.9\.[0-9]+\.9'
    value_pattern: "Counter64: 43450"

  sas:
    label: "SEAGATE ST4000NM0023"
    walk_label: "sas"
    oid_grep_re: '\.5\.1\.6\.1\.2\.[0-9]+\.1'
    value_pattern: "Gauge32: 3"

  farmata:
    # ...6.1.3.1.4.1889140974.4 = STRING: seagate_farm_log.page_4_environment_statistics.current_5v_in_mv
    label: "Seagate ST16000NM000J ZR7061LA (FARM)"
    walk_label: "sensor"
    oid_grep_re: '\.6\.1\.3\.1\.7\.[0-9]+\.3'
    value_pattern: "INTEGER: 12189"

# Walk definitions — which OID subtree to walk for each label.
# Used by both discovery and section tests.
walks:
  common: ".2"
  nvme:   ".3"
  sata:   ".4"
  sas:    ".5"
  sensor: ".6"

# ---------------------------------------------------------------------------
# Test sections
# ---------------------------------------------------------------------------
# Each section has:
#   name:         Human-readable label for summary output
#   walk:         Which walk file to query (key from walks: above)
#   device:       (optional) Which discovery entry provides {D} substitution
#   oid_template: (optional) OID suffix pattern shared by all tests in the section.
#                 Supports {col} (replaced per-test) and {inst} (replaced per-test
#                 when specified, otherwise removed).  Also supports {D}, {nvme},
#                 {sata}, {sas} device-index substitutions.
#   skip:         (optional) Skip reason — section is not run
#   tests:        List of test entries
#
# Test entry fields:
#   label:    Short description
#   type:     "oid" (default) or "rows"
#
#   For type=oid with oid_template:
#     col:    Column number substituted into {col} in the section's oid_template
#     inst:   (optional) Instance index substituted into {inst} in the template
#
#   For type=oid without oid_template (or to override):
#     oid:    Full OID suffix relative to ent_oid (e.g. ".2.1.1.0")
#             Supports {D} for device index, {nvme}/{sata}/{sas} for cross-refs
#   expected: ERE matched against the "= VALUE" part of the snmpwalk line
#
#   For type=rows:
#     oid_regex: ERE suffix applied after ent_oid (dots must be pre-escaped)
#     min:       Minimum number of matching lines expected

sections:

  - name: "Common MIB"
    walk: "common"
    # Each test references a different device so no shared oid_template; use oid: directly.
    tests:
      - {label: "deviceCount scalar",       oid: ".2.1.1.0",            expected: "Gauge32: [0-9]+"}
      - {label: "device table >= 3 rows",   type: rows, oid_regex: '\.2\.1\.3\.1\.2\.', min: 3}
      - {label: "NVMe path",                oid: ".2.1.3.1.3.{nvme}",   expected: 'STRING: "/dev/nvme[0-9]+"'}
      - {label: "NVMe type = 5",            oid: ".2.1.3.1.4.{nvme}",   expected: "INTEGER: 5"}
      - {label: "NVMe pollResult = 1",      oid: ".2.1.3.1.6.{nvme}",   expected: "INTEGER: 1"}
      - {label: "NVMe pollExitStatus = 0",  oid: ".2.1.3.1.7.{nvme}",   expected: "Gauge32: 0"}
      - {label: "SATA path",                oid: ".2.1.3.1.3.{sata}",   expected: 'STRING: ".*"'}
      - {label: "SATA type = 1",            oid: ".2.1.3.1.4.{sata}",   expected: "INTEGER: 1"}
      - {label: "SATA pollResult = 1",      oid: ".2.1.3.1.6.{sata}",   expected: "INTEGER: 1"}
      - {label: "SATA pollExitStatus = 0",  oid: ".2.1.3.1.7.{sata}",   expected: "Gauge32: 0"}
      - {label: "SAS path",                 oid: ".2.1.3.1.3.{sas}",    expected: 'STRING: ".*"'}
      - {label: "SAS type = 3",             oid: ".2.1.3.1.4.{sas}",    expected: "INTEGER: 3"}
      - {label: "SAS pollResult = 1",        oid: ".2.1.3.1.6.{sas}",    expected: "INTEGER: 1"}
      - {label: "SAS pollExitStatus = 0",   oid: ".2.1.3.1.7.{sas}",    expected: "Gauge32: 0"}
      - {label: "pollFailureThreshold = 1", oid: ".2.1.7.0",             expected: "Gauge32: 1"}

  # ---------------------------------------------------------------------------
  # NVMe — Samsung 980 PRO 1TB
  # ---------------------------------------------------------------------------

  - name: "NVMe Health"
    walk: "nvme"
    device: nvme
    oid_template: ".3.1.15.1.{col}.{D}.1"
    tests:
      - {label: "col1  healthOverallStatus = 1 (passed)",         col: 1,  expected: "INTEGER: 1"}
      - {label: "col2  criticalWarning (BITS) = 00",              col: 2,  expected: '(?:BITS|Hex-STRING): 00 *'}
      - {label: "col7  dataUnitsRead",                            col: 7,  expected: "Counter64: 12004521"}
      - {label: "col8  dataUnitsWritten",                         col: 8,  expected: "Counter64: 44110234"}
      - {label: "col9  dataBytesRead",                            col: 9,  expected: "Counter64: 6146314752000"}
      - {label: "col10 dataBytesWritten",                         col: 10, expected: "Counter64: 22584439808000"}
      - {label: "col11 hostReadCommands",                         col: 11, expected: "Counter64: 198443021"}
      - {label: "col12 hostWriteCommands",                        col: 12, expected: "Counter64: 612303918"}
      - {label: "col13 controllerBusyTimeMinutes = 1832",         col: 13, expected: "Counter64: 1832"}
      - {label: "col14 powerCycles = 14",                         col: 14, expected: "Counter64: 14"}
      - {label: "col15 powerOnHours = 1827",                      col: 15, expected: "Counter64: 1827"}
      - {label: "col16 unsafeShutdowns = 3",                      col: 16, expected: "Counter64: 3"}
      - {label: "col17 mediaDataIntegrityErrors = 0",             col: 17, expected: "Counter64: 0"}
      - {label: "col18 errorInformationLogEntries = 0",           col: 18, expected: "Counter64: 0"}
      - {label: "col19 warningTemperatureTimeMinutes = 0",        col: 19, expected: "Counter64: 0"}
      - {label: "col20 criticalTemperatureTimeMinutes = 0",       col: 20, expected: "Counter64: 0"}
      - {label: "col22 currentSelfTestOperationValue = 0",        col: 22, expected: "Gauge32: 0"}
      - {label: "col23 currentSelfTestOperationString",           col: 23, expected: 'STRING: "No self-test in progress"'}

  - name: "NVMe Self-test"
    walk: "nvme"
    device: nvme
    oid_template: ".3.1.18.1.{col}.{D}.{inst}"
    tests:
      - {label: "table >= 2 entries",                     type: rows, oid_regex: '\.3\.1\.18\.1\.2\.', min: 2}
      - {label: "entry[1] col2  testNumber = 1",          col: 2,  inst: 1, expected: "Gauge32: 1"}
      - {label: "entry[1] col3  testType = 1 (Short)",    col: 3,  inst: 1, expected: "INTEGER: 1"}
      - {label: "entry[1] col4  result = 0 (no error)",   col: 4,  inst: 1, expected: "INTEGER: 0"}
      - {label: "entry[1] col5  resultStr",               col: 5,  inst: 1, expected: 'STRING: "Completed without error"'}
      - {label: "entry[1] col6  powerOnHoursAtTest=1826", col: 6,  inst: 1, expected: "Counter64: 1826"}
      - {label: "entry[1] col8  namespaceId = 0xFFFFFFFF",col: 8,  inst: 1, expected: "Gauge32: 4294967295"}
      - {label: "entry[1] col9  segmentNumber = 0",       col: 9,  inst: 1, expected: "Gauge32: 0"}
      - {label: "entry[1] col10 statusCodeType = 0",      col: 10, inst: 1, expected: "Gauge32: 0"}
      - {label: "entry[1] col11 statusCode = 0",          col: 11, inst: 1, expected: "Gauge32: 0"}
      - {label: "entry[2] col2  testNumber = 2",          col: 2,  inst: 2, expected: "Gauge32: 2"}
      - {label: "entry[2] col3  testType = 2 (Extended)", col: 3,  inst: 2, expected: "INTEGER: 2"}
      - {label: "entry[2] col4  result = 0 (no error)",   col: 4,  inst: 2, expected: "INTEGER: 0"}
      - {label: "entry[2] col6  powerOnHoursAtTest=1800", col: 6,  inst: 2, expected: "Counter64: 1800"}

  - name: "NVMe Controller"
    walk: "nvme"
    device: nvme
    oid_template: ".3.1.3.1.{col}.{D}.1"
    tests:
      - {label: "col1  pciVendorId = 5387",         col: 1,  expected: "Gauge32: 5387"}
      - {label: "col3  totalCapacityBytes",         col: 3,  expected: "Counter64: 1000204886016"}
      - {label: "col4  unallocatedCapacityBytes",   col: 4,  expected: "Counter64: 0"}
      - {label: "col5  controllerId = 1",           col: 5,  expected: "Gauge32: 1"}
      - {label: "col6  version = 1.3",              col: 6,  expected: 'STRING: "1.3"'}
      - {label: "col7  namespaceCount = 1",         col: 7,  expected: "Gauge32: 1"}
      - {label: "col8  maxDataTransferPages = 0",   col: 8,  expected: "Gauge32: 0"}
      - {label: "col12 pciSubsystemId = 2",         col: 12, expected: "Gauge32: 2"}
      - {label: "col13 versionValue = 66304",       col: 13, expected: "Gauge32: 66304"}
      - {label: "col14 pciVendorIdText",            col: 14, expected: 'STRING: "YAMASHITA Systems Corp"'}
      - {label: "col15 pciSubsystemIdText = empty", col: 15, expected: '""'}

  - name: "NVMe Namespace"
    walk: "nvme"
    device: nvme
    oid_template: ".3.1.6.1.{col}.{D}.1"
    tests:
      - {label: "ns[1] col1  namespaceId = 1",         col: 1,  expected: "Gauge32: 1"}
      - {label: "ns[1] col2  sizeBytes",               col: 2,  expected: "Counter64: 1000204886016"}
      - {label: "ns[1] col3  capacityBytes",           col: 3,  expected: "Counter64: 1000204886016"}
      - {label: "ns[1] col4  utilizationBytes",        col: 4,  expected: "Counter64: 998400000000"}
      - {label: "ns[1] col5  formattedLbaSize = 512",  col: 5,  expected: "Gauge32: 512"}
      - {label: "ns[1] col8  sizeBlocks",              col: 8,  expected: "Counter64: 1953525168"}
      - {label: "ns[1] col10 utilizationBlocks",       col: 10, expected: "Counter64: 1950000000"}

  - name: "NVMe Power State"
    walk: "nvme"
    device: nvme
    oid_template: ".3.1.9.1.{col}.{D}.{inst}"
    # inst = power state index (starts at 0)
    tests:
      - {label: "ps[0] col2  operational = true",        col: 2,  inst: 0, expected: "INTEGER: 1"}
      - {label: "ps[0] col3  maxPowerMilliWatts = 7000", col: 3,  inst: 0, expected: "Gauge32: 7000"}
      - {label: "ps[0] col6  readLatencyRank = 0",       col: 6,  inst: 0, expected: "Gauge32: 0"}
      - {label: "ps[0] col7  readThroughputRank = 0",    col: 7,  inst: 0, expected: "Gauge32: 0"}
      - {label: "ps[0] col8  writeLatencyRank = 0",      col: 8,  inst: 0, expected: "Gauge32: 0"}
      - {label: "ps[0] col9  writeThroughputRank = 0",   col: 9,  inst: 0, expected: "Gauge32: 0"}
      - {label: "ps[0] col10 entryLatencyUsec = 0",      col: 10, inst: 0, expected: "Gauge32: 0"}
      - {label: "ps[0] col11 exitLatencyUsec = 0",       col: 11, inst: 0, expected: "Gauge32: 0"}
      - {label: "ps[1] col2  operational = false",       col: 2,  inst: 1, expected: "INTEGER: 2"}
      - {label: "ps[1] col3  maxPowerMilliWatts = 10",   col: 3,  inst: 1, expected: "Gauge32: 10"}
      - {label: "ps[1] col6  readLatencyRank = 3",       col: 6,  inst: 1, expected: "Gauge32: 3"}
      - {label: "ps[1] col7  readThroughputRank = 3",    col: 7,  inst: 1, expected: "Gauge32: 3"}
      - {label: "ps[1] col8  writeLatencyRank = 3",      col: 8,  inst: 1, expected: "Gauge32: 3"}
      - {label: "ps[1] col9  writeThroughputRank = 3",   col: 9,  inst: 1, expected: "Gauge32: 3"}
      - {label: "ps[1] col10 entryLatencyUsec = 5000",   col: 10, inst: 1, expected: "Gauge32: 5000"}
      - {label: "ps[1] col11 exitLatencyUsec = 10000",   col: 11, inst: 1, expected: "Gauge32: 10000"}

  - name: "NVMe LBA Format"
    walk: "nvme"
    device: nvme
    oid_template: ".3.1.12.1.{col}.{D}.{inst}"
    # inst = "{nsId}.{fmtId}" — only one namespace and one format in fixture
    tests:
      - {label: "lba[0] col2 current = true",          col: 2, inst: "1.0", expected: "INTEGER: 1"}
      - {label: "lba[0] col3 dataSizeBytes = 512",      col: 3, inst: "1.0", expected: "Gauge32: 512"}
      - {label: "lba[0] col4 metadataSizeBytes = 0",    col: 4, inst: "1.0", expected: "Gauge32: 0"}
      - {label: "lba[0] col5 relativePerformance = 0",  col: 5, inst: "1.0", expected: "Gauge32: 0"}

  - name: "NVMe Error Log"
    walk: "nvme"
    device: nvme
    oid_template: ".3.1.21.1.{col}.{D}.1"
    tests:
      - {label: "errlog[1] col2  errorCount = 7",           col: 2,  expected: "Counter64: 7"}
      - {label: "errlog[1] col3  sqid = 0",                 col: 3,  expected: "Gauge32: 0"}
      - {label: "errlog[1] col4  commandId = 3",            col: 4,  expected: "Gauge32: 3"}
      - {label: "errlog[1] col5  statusField = 5",          col: 5,  expected: "Gauge32: 5"}
      - {label: "errlog[1] col8  nsid = 1",                 col: 8,  expected: "Gauge32: 1"}
      - {label: "errlog[1] col10 statusCode = 5",           col: 10, expected: "Gauge32: 5"}
      - {label: "errlog[1] col11 statusCodeType = 0",       col: 11, expected: "Gauge32: 0"}
      - {label: "errlog[1] col12 doNotRetry = 2 (false)",   col: 12, expected: "INTEGER: 2"}
      - {label: "errlog[1] col13 statusString",                        col: 13, expected: 'STRING: "Invalid Field in Command"'}
      - {label: "errlog[1] col14 phaseTag = 2 (false)",              col: 14, expected: "INTEGER: 2"}
      - {label: "errlog[1] col15 errorTimestamp (DateAndTime)",      col: 15, expected: 'Hex-STRING: ([0-9A-F]{2} ){11}'}

  - name: "NVMe Capability"
    walk: "nvme"
    device: nvme
    oid_template: ".3.1.24.1.{col}.{D}.1"
    tests:
      - {label: "col1 firmwareUpdateRaw = 0",           col: 1, expected: "Gauge32: 0"}
      - {label: "col2 firmwareSlotCount = 0",           col: 2, expected: "Gauge32: 0"}
      - {label: "col3 firmwareResetRequired = false",   col: 3, expected: "INTEGER: 2"}
      - {label: "col4 optionalAdminCommandRaw = 0",     col: 4, expected: "Gauge32: 0"}
      - {label: "col5 optionalNvmCommandRaw = 0",       col: 5, expected: "Gauge32: 0"}
      - {label: "col6 logPageAttributesRaw = 0",        col: 6, expected: "Gauge32: 0"}
      - {label: "col7 optionalAdminCommandText = empty",col: 7, expected: '""'}
      - {label: "col8 optionalNvmCommandText = empty",  col: 8, expected: '""'}
      - {label: "col9 logPageAttributesText = empty",   col: 9, expected: '""'}

  # ---------------------------------------------------------------------------
  # SATA — WDC WD140EFGX SELFTESTS
  # ---------------------------------------------------------------------------

  - name: "SATA Info"
    walk: "sata"
    device: sata
    oid_template: ".4.1.3.1.{col}.{D}"
    # No trailing instance index — each drive has exactly one row
    tests:
      - {label: "col3  rotationRate = 5400",     col: 3,  expected: "Gauge32: 5400"}
      - {label: "col5  logicalBlockSize = 4096", col: 5,  expected: "Gauge32: 4096"}
      - {label: "col7  userCapacityBytes",       col: 7,  expected: "Counter64: 14000519643136"}
      - {label: "col8  inSmartctlDb = 1",        col: 8,  expected: "INTEGER: 1"}
      - {label: "col9  smartAvailable = 1",      col: 9,  expected: "INTEGER: 1"}
      - {label: "col10 smartEnabled = 1",        col: 10, expected: "INTEGER: 1"}
      - {label: "col11 trimSupported = 2",       col: 11, expected: "INTEGER: 2"}
      - {label: "col63 sctHistOpLimitMin = 0",   col: 63, expected: "INTEGER: 0"}
      - {label: "col64 sctHistOpLimitMax = 0",   col: 64, expected: "INTEGER: 0"}
      - {label: "col65 sctHistLimitMin = 0",     col: 65, expected: "INTEGER: 0"}
      - {label: "col66 sctHistLimitMax = 0",     col: 66, expected: "INTEGER: 0"}

  - name: "SATA Health"
    walk: "sata"
    device: sata
    oid_template: ".4.1.6.1.{col}.{D}"
    # No trailing instance index — each drive has exactly one row
    tests:
      - {label: "col1 overallStatus = 1 (passed)", col: 1, expected: "INTEGER: 1"}
      - {label: "col2 offlineStatusValue = 2",     col: 2, expected: "INTEGER: 2"}
      - {label: "col4 powerCycles = 42",           col: 4, expected: "Counter64: 42"}
      - {label: "col5 powerOnHours = 4321",        col: 5, expected: "Counter64: 4321"}
      - {label: "col6 errorLogCount = 1",          col: 6, expected: "Gauge32: 1"}
      - {label: "col18 sctTempUnderLimitCount = 0", col: 18, expected: "Gauge32: 0"}
      - {label: "col19 sctTempOverLimitCount = 0",  col: 19, expected: "Gauge32: 0"}
      - {label: "col20 sctSmartStatusPassed = 1",   col: 20, expected: "INTEGER: 1"}

  - name: "SATA Health SCT (81GDJW2V)"
    walk: "sata"
    device: sata2
    oid_template: ".4.1.6.1.{col}.{D}"
    tests:
      - {label: "col11 sctStatusFormatVersion = 3", col: 11, expected: "Gauge32: 3"}
      - {label: "col12 sctStatusSctVersion = 256",  col: 12, expected: "Gauge32: 256"}
      - {label: "col13 sctStatusDeviceState = 0",   col: 13, expected: "Gauge32: 0"}
      - {label: "col14 sctTempPowerCycleMin = 39",  col: 14, expected: "INTEGER: 39"}
      - {label: "col15 sctTempPowerCycleMax = 45",  col: 15, expected: "INTEGER: 45"}
      - {label: "col16 sctTempLifetimeMin = 22",    col: 16, expected: "INTEGER: 22"}
      - {label: "col17 sctTempLifetimeMax = 53",    col: 17, expected: "INTEGER: 53"}

  - name: "SATA Attributes"
    walk: "sata"
    device: sata
    oid_template: ".4.1.9.1.{col}.{D}.{inst}"
    # inst = SMART attribute ID
    tests:
      - {label: "attr[1] col2  name = Raw_Read_Error_Rate", col: 2,  inst: 1, expected: 'STRING: "Raw_Read_Error_Rate"'}
      - {label: "attr[1] col4  prefailure = 1 (true)",      col: 4,  inst: 1, expected: "INTEGER: 1"}
      - {label: "attr[1] col5  updatedOnline = 1 (true)",   col: 5,  inst: 1, expected: "INTEGER: 1"}
      - {label: "attr[1] col6  value = 200",                col: 6,  inst: 1, expected: "Gauge32: 200"}
      - {label: "attr[1] col7  worst = 200",                col: 7,  inst: 1, expected: "Gauge32: 200"}
      - {label: "attr[1] col8  threshold = 51",             col: 8,  inst: 1, expected: "Gauge32: 51"}
      - {label: "attr[1] col9  rawValue = 0",               col: 9,  inst: 1, expected: "Counter64: 0"}
      - {label: "attr[1] col10 rawStr = 0",                 col: 10, inst: 1, expected: 'STRING: "0"'}
      - {label: "attr[9] col2  name = Power_On_Hours",      col: 2,  inst: 9, expected: 'STRING: "Power_On_Hours"'}
      - {label: "attr[9] col4  prefailure = 2 (false)",     col: 4,  inst: 9, expected: "INTEGER: 2"}
      - {label: "attr[9] col5  updatedOnline = 1 (true)",   col: 5,  inst: 9, expected: "INTEGER: 1"}
      - {label: "attr[9] col6  value = 100",                col: 6,  inst: 9, expected: "Gauge32: 100"}
      - {label: "attr[9] col7  worst = 100",                col: 7,  inst: 9, expected: "Gauge32: 100"}
      - {label: "attr[9] col8  threshold = 0",              col: 8,  inst: 9, expected: "Gauge32: 0"}
      - {label: "attr[9] col9  rawValue = 4321",            col: 9,  inst: 9, expected: "Counter64: 4321"}
      - {label: "attr[9] col10 rawStr = 4321",              col: 10, inst: 9, expected: 'STRING: "4321"'}

  - name: "SATA Self-test"
    walk: "sata"
    device: sata
    oid_template: ".4.1.18.1.{col}.{D}.{inst}"
    tests:
      - {label: "table >= 3 entries",                      type: rows, oid_regex: '\.4\.1\.18\.1\.2\.', min: 3}
      - {label: "entry[1] col2 testNumber = 1 (Short)",    col: 2, inst: 1, expected: "INTEGER: 1"}
      - {label: "entry[1] col3 result = 1",                col: 3, inst: 1, expected: "INTEGER: 1"}
      - {label: "entry[1] col4 passed = 1 (true)",         col: 4, inst: 1, expected: "INTEGER: 1"}
      - {label: "entry[1] col5 remaining = 0%",            col: 5, inst: 1, expected: "Gauge32: 0"}
      - {label: "entry[1] col6 powerOnHoursAtTest = 4300", col: 6, inst: 1, expected: "Counter64: 4300"}
      - {label: "entry[1] col7 lbaFirstError = 0",         col: 7, inst: 1, expected: "Counter64: 0"}
      - {label: "entry[2] col2 testNumber = 2 (Extended)", col: 2, inst: 2, expected: "INTEGER: 2"}
      - {label: "entry[2] col3 result = 1",                col: 3, inst: 2, expected: "INTEGER: 1"}
      - {label: "entry[2] col4 passed = 1 (true)",         col: 4, inst: 2, expected: "INTEGER: 1"}
      - {label: "entry[2] col6 powerOnHoursAtTest = 4100", col: 6, inst: 2, expected: "Counter64: 4100"}

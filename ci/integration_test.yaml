  # ── Sensor (smartmonSensorMIB = ent_oid.6; notifications at .6.2.x) ──
  # Sensor threshold fixtures add nvme_composite_temperature_threshold to
  # the NVMe JSON so the daemon populates has_high_warning/has_high_critical.
  # LowWarning/LowCritical use the available_spare field (threshold = spare_threshold * 2 / spare_threshold).
  - name: "sensor HighCriticalExceeded"
    trigger_fixture: "smartd-json.Samsung_SSD_980_PRO_1TB-S6B0NJ0N123456.sensor-high-crit.nvme.json"
    replace_fixture:  "smartd-json.Samsung_SSD_980_PRO_1TB-S6B0NJ0N123456.nvme.json"

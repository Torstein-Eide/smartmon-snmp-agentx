  # INDEX { deviceIndex(NOT-ACC), pageNum(NOT-ACC), offset(NOT-ACC) }
  # FARM pages use page_num 100-105 to avoid collision with ACS pages 1-7.
  # OID: .4.1.40.1.{col}.{D}.{pageNum}.{offset}
  # page 103 = FARM Error Statistics; sub-objects flattened as "parent.child"
  # page 104 = FARM Environment Statistics
  # Offsets are JSON insertion order; current_12v_in_mv is offset 16 in page 104.
  # ---------------------------------------------------------------------------

  - name: "SATA FARM DevStats — page 103 error stats (scalars + flattened sub-objects)"
    walk: "sata"
    device: farmata
    tests:

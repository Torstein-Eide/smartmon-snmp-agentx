# ---------------------------------------------------------------------------
# Stability checks
# ---------------------------------------------------------------------------
# Each entry re-writes an unchanged fixture (triggering inotify → re-parse)
# then does a fresh SNMP walk and verifies that every listed OID has the same
# value as in the initial walk.  Any LastChange advancement on a no-data-change
# re-parse is a bug.
#
# The live fixture directory already contains multiple SATA devices on startup,
# so all re-parse checks are true multi-device scenarios.

stability_checks:

  # Each entry mutates a fixture JSON field, waits for re-parse, then checks
  # all last_change_oids.  For each mutation exactly one OID must advance (!);
  # all others must stay stable (.).  Mutations are sequential: each builds on
  # the state left by the previous one.

  - name: "SATA LastChange: update Device #1"
    fixture: "smartd-json.WDC_WD140EFGX_68B0GN0-SELFTESTS.ata.json"
    wait_seconds: 0.1
    walk: "sata"
    last_change_oids:
      # 12 ByDevice LastChange for the SELFTESTS device ({sata}).
      - ".4.1.2.2.1.3.{sata}.1"
      - ".4.1.2.2.1.3.{sata}.2"
      - ".4.1.2.2.1.3.{sata}.3"
      - ".4.1.2.2.1.3.{sata}.4"
      - ".4.1.2.2.1.3.{sata}.5"
      - ".4.1.2.2.1.3.{sata}.6"
      - ".4.1.2.2.1.3.{sata}.7"
      - ".4.1.2.2.1.3.{sata}.8"
      - ".4.1.2.2.1.3.{sata}.9"
      - ".4.1.2.2.1.3.{sata}.10"
      - ".4.1.2.2.1.3.{sata}.11"
      - ".4.1.2.2.1.3.{sata}.12"
    mutations:
      - label: "attr[Power_On_Hours].raw +1 → attrTable ByDevice"
        json_path: "ata_smart_attributes.table.1.raw.value"
        new_value: 4322
        expected_change_oid: ".4.1.2.2.1.3.{sata}.3"

  - name: "SATA LastChange: update Device #2"
    fixture: "smartd-json.WDC_WD140EFGX_68B0GN0-81GDJW2V.ata.json"
    wait_seconds: 0.1
    walk: "sata"
    last_change_oids:
      # 11 ByDevice LastChange for the 81GDJW2V device ({sata2}).
      # tableId 11 (sataDevStat) intentionally omitted — covered by BySubindex check below.
      - ".4.1.2.2.1.3.{sata2}.1"    # sataInfo
      - ".4.1.2.2.1.3.{sata2}.2"    # sataHealth
      - ".4.1.2.2.1.3.{sata2}.3"    # sataAttr
      - ".4.1.2.2.1.3.{sata2}.4"    # sataErrorLog
      - ".4.1.2.2.1.3.{sata2}.5"    # sataErrorCmd
      - ".4.1.2.2.1.3.{sata2}.6"    # sataSelfTest
      - ".4.1.2.2.1.3.{sata2}.7"    # sataErc
      - ".4.1.2.2.1.3.{sata2}.8"    # sataPhyEvent
      - ".4.1.2.2.1.3.{sata2}.9"    # sataSelectiveTest
      - ".4.1.2.2.1.3.{sata2}.10"   # sataLogDir
      - ".4.1.2.2.1.3.{sata2}.12"   # sataPendingDefects
    mutations:
      - label: "power_on_time.hours +1 → sataHealth"
        json_path: "power_on_time.hours"
        new_value: 43451
        expected_change_oid: ".4.1.2.2.1.3.{sata2}.2"
      - label: "attr[Raw_Read_Error_Rate].raw +1 → sataAttr"
        json_path: "ata_smart_attributes.table.0.raw.value"
        new_value: 1
        expected_change_oid: ".4.1.2.2.1.3.{sata2}.3"

  - name: "SATA LastChange, Device #2: devstat row changes advance correct BySubindex"
    fixture: "smartd-json.WDC_WD140EFGX_68B0GN0-81GDJW2V.ata.json"
    wait_seconds: 0.1
    walk: "sata"
    last_change_oids:
      # BySubindex LastChange — INDEX {deviceIndex, sataDevStat=11, page_num}
      - ".4.1.2.3.1.4.{sata2}.11.1"    # page 1 — General Statistics
      - ".4.1.2.3.1.4.{sata2}.11.3"    # page 3 — Rotating Media Statistics
      - ".4.1.2.3.1.4.{sata2}.11.4"    # page 4 — General Errors Statistics
      - ".4.1.2.3.1.4.{sata2}.11.5"    # page 5 — Temperature Statistics
      - ".4.1.2.3.1.4.{sata2}.11.6"    # page 6 — Transport Statistics
      - ".4.1.2.3.1.4.{sata2}.11.255"  # page 255 — Vendor Specific Statistics
    mutations:
      # page 1
      - label: "p1 offset=8  Lifetime Power-On Resets +1"
        json_path: "ata_device_statistics.pages.0.table.0.value"
        new_value: 58
        expected_change_oid: ".4.1.2.3.1.4.{sata2}.11.1"
      - label: "p1 offset=16 Power-on Hours +1"
        json_path: "ata_device_statistics.pages.0.table.1.value"
        new_value: 43451
        expected_change_oid: ".4.1.2.3.1.4.{sata2}.11.1"
      - label: "p1 offset=24 Logical Sectors Written +1"
        json_path: "ata_device_statistics.pages.0.table.2.value"
        new_value: 12345679
        expected_change_oid: ".4.1.2.3.1.4.{sata2}.11.1"
      - label: "p1 offset=32 Logical Sectors Read +1"
        json_path: "ata_device_statistics.pages.0.table.3.value"
        new_value: 56789013
        expected_change_oid: ".4.1.2.3.1.4.{sata2}.11.1"
      - label: "p1 offset=40 Number of Read Commands +1"
        json_path: "ata_device_statistics.pages.0.table.4.value"
        new_value: 3210988

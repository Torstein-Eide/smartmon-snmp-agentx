# ---------------------------------------------------------------------------
# Notification tests (SNMP trap delivery)
# ---------------------------------------------------------------------------
# Each enabled entry swaps a "failing" fixture into the live fixture directory,
# waits for inotify -> re-parse -> trap delivery, then checks snmptrapd output.
#
# skip: "no fixture"            — no variant fixture exists yet for this trap
# skip: "not yet implemented"   — fixture exists; trap path not verified end-to-end
# (no skip field)               — test is active

notifications:

  # ── Common (smartmonCommonMIB = ent_oid.2; notifications at .2.3.x) ──
  - name: "common DeviceDiscovered"
    action: add
    trigger_fixture: "smartd-json.Integration_Discovered_NVMe-DISCOVER01.discover.nvme.json"
    target_fixture:  "smartd-json.Integration_Discovered_NVMe-DISCOVER01.nvme.json"
    wait_seconds: 0.4
    expected_traps:
      - {oid_suffix: ".2.3.1", value_pattern: ".*"}

  - name: "common DeviceRemoved"
    action: remove
    setup_fixture: "smartd-json.Integration_Discovered_NVMe-DISCOVER01.discover.nvme.json"
    target_fixture: "smartd-json.Integration_Discovered_NVMe-DISCOVER01.nvme.json"
    wait_seconds: 0.2
    expected_traps:
      - {oid_suffix: ".2.3.2", value_pattern: ".*"}

  - name: "common DevicePollFailed"
    trigger_fixture: "smartd-json.Samsung_SSD_980_PRO_1TB-S6B0NJ0N123456.poll-failed.nvme.json"
    replace_fixture:  "smartd-json.Samsung_SSD_980_PRO_1TB-S6B0NJ0N123456.nvme.json"
    wait_seconds: 0.2
    expected_traps:
      - {oid_suffix: ".2.3.3", value_pattern: ".*"}

  # ── NVMe (smartmonNvmeMIB = ent_oid.3; notifications at .3.2.x) ──────
  - name: "nvme HealthFailed"
    trigger_fixture: "smartd-json.Samsung_SSD_980_PRO_1TB-S6B0NJ0N123456.nvme.failing.json"
    replace_fixture:  "smartd-json.Samsung_SSD_980_PRO_1TB-S6B0NJ0N123456.nvme.json"
    wait_seconds: 0.2
    expected_traps:
      - {oid_suffix: ".3.2.1", value_pattern: ".*"}
      - {oid_suffix: ".2.1.3.1.11.{nvme}", value_pattern: 'STRING: "?Samsung SSD 980 PRO 1TB"?'}
      - {oid_suffix: ".2.1.3.1.12.{nvme}", value_pattern: 'STRING: "?S6B0NJ0N123456"?'}

  - name: "nvme SelfTestFailed"
    trigger_fixture: "smartd-json.Samsung_SSD_980_PRO_1TB-S6B0NJ0N123456.nvme.selftest-fail.json"
    replace_fixture:  "smartd-json.Samsung_SSD_980_PRO_1TB-S6B0NJ0N123456.nvme.json"
    wait_seconds: 0.2
    expected_traps:
      - {oid_suffix: ".3.2.2", value_pattern: ".*"}
      - {oid_suffix: ".2.1.3.1.11.{nvme}", value_pattern: 'STRING: "?Samsung SSD 980 PRO 1TB"?'}
      - {oid_suffix: ".2.1.3.1.12.{nvme}", value_pattern: 'STRING: "?S6B0NJ0N123456"?'}

  # ── SATA (smartmonSataMIB = ent_oid.4; notifications at .4.2.x) ──────
  - name: "sata HealthFailed"
    trigger_fixture: "smartd-json.WDC_WD140EFGX_68B0GN0-SELFTESTS.health-fail.ata.json"
    replace_fixture:  "smartd-json.WDC_WD140EFGX_68B0GN0-SELFTESTS.ata.json"
    wait_seconds: 0.2
    expected_traps:
      - {oid_suffix: ".4.2.1", value_pattern: ".*"}
      - {oid_suffix: ".2.1.3.1.11.{sata}", value_pattern: 'STRING: "?WDC WD140EFGX-68B0GN0"?'}
      - {oid_suffix: ".2.1.3.1.12.{sata}", value_pattern: 'STRING: "?WD140SELFTESTS"?'}

  - name: "sata AttrFailing"

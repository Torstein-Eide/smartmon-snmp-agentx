      - {label: "p104 off16 name = current_12v_in_mv",     oid: ".4.1.40.1.4.{D}.104.16", expected: 'STRING: "current_12v_in_mv"'}
      - {label: "p104 off16 value = 12189",                oid: ".4.1.40.1.5.{D}.104.16", expected: "Counter64: 12189"}

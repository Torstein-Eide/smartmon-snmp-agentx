# /etc/smartmontools/snmp-agentxd.conf
# Configuration for smartmon-snmp-agentxd
#
# smartmon-snmp-agentxd reads SMART data from JSON state files written by
# smartd's --jsonstate option.  You MUST configure smartd with -x (extended)
# to include NVMe self-test logs and SAS error counters in the state files:
#
#   DEVICESCAN -x --jsonstate /run/smartmontools/json/
#
# Using -a instead of -x will leave the NVMe self-test and SAS error counter
# MIB tables empty.
#
# (or per-device equivalents) and then set state_dir below to the same path.

# -----------------------------------------------------------------------
# REQUIRED: directory where smartd writes --jsonstate files.
# smartmon-snmp-agentxd will refuse to start if this is not set or if
# smartd is running without --jsonstate configured.
# -----------------------------------------------------------------------
state_dir   /run/smartmontools/json/

# -----------------------------------------------------------------------
# Path to the AgentX master socket.  Must match agentXSocket in snmpd.conf.
# -----------------------------------------------------------------------
agentx_socket   /var/agentx/master

# -----------------------------------------------------------------------
# Maximum age of cached SNMP data in seconds.  Stale data older than
# 2 × cache_timeout triggers a LOG_WARNING to syslog.
# -----------------------------------------------------------------------
cache_timeout   300

# -----------------------------------------------------------------------
# Path to a SQLite database for persisting table-change timestamps across
# daemon restarts.  If the database file does not exist, the agent creates it
# on first start.
#
# The directory must be writable by the daemon user.
# -----------------------------------------------------------------------
state_db   /var/lib/smartmontools/snmp-agent/snmp-agentxd-state.db

# -----------------------------------------------------------------------
# Sensor alarm state tracking
#
# By default sensor traps fire only on state transitions (NORMAL → alarm
# or alarm → NORMAL), and a smartmonSensorRecovered trap is sent when a
# sensor returns to normal.  The options below tune this behaviour.
# -----------------------------------------------------------------------

# Number of units of hysteresis applied when clearing a sensor alarm.
# For high alarms: value must drop below (threshold − hysteresis) before
# the alarm clears.  For low alarms: value must rise above (threshold +
# hysteresis).  Set to 0 (default) to disable hysteresis.
#sensor_hysteresis   0

# If non-zero, re-send the current sensor alarm trap every N seconds even
# when the state has not changed.  Useful so NMS managers do not lose
# persistent alarms after a reconnect.  Set to 0 (default) to disable.
#sensor_resend_interval   0

# When set to true, sensor traps fire on every refresh regardless of prior
# state (i.e. the original behaviour before state tracking was added).
# This is intended for CI/integration testing only.
#test_mode   false
